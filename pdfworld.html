<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF World — Free Online PDF Tools in Your Browser</title>
<meta name="description" content="Merge, split, compress, convert, rotate, watermark and sign PDFs securely for free. 100% private in your browser — your files never leave your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-display: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  
  /* Light Theme (Default) */
  --bg: #F8FAFC;
  --bg-subtle: #F1F5F9;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EDF2F7;
  --surface-elevated: #FFFFFF;
  --ink: #0F172A;
  --ink-secondary: #334155;
  --muted: #64748B;
  --muted-light: #94A3B8;
  --line: #E2E8F0;
  --line-subtle: #EDF2F7;
  --line-strong: #CBD5E1;
  
  /* Primary & Brand Accents */
  --primary: #4F46E5;
  --primary-hover: #4338CA;
  --primary-light: #EEF2FF;
  --primary-glow: rgba(79, 70, 229, 0.18);
  --accent-cyan: #06B6D4;
  --accent-purple: #8B5CF6;
  --primary-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 55%, #06B6D4 100%);
  --brand-gradient: linear-gradient(135deg, #4F46E5 0%, #6366F1 50%, #06B6D4 100%);
  --hero-glow: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, rgba(6, 182, 212, 0.05) 45%, transparent 70%);

  /* Categories */
  --cat-organize: #2563EB;
  --cat-organize-bg: rgba(37, 99, 235, 0.09);
  --cat-optimize: #059669;
  --cat-optimize-bg: rgba(5, 150, 105, 0.09);
  --cat-convert: #D97706;
  --cat-convert-bg: rgba(217, 119, 6, 0.09);
  --cat-edit: #7C3AED;
  --cat-edit-bg: rgba(124, 58, 237, 0.09);
  --cat-sign: #E11D48;
  --cat-sign-bg: rgba(225, 29, 72, 0.09);
  
  /* Status */
  --danger-bg: #FFF1F2;
  --danger-ink: #9F1239;
  --danger-border: #FECDD3;
  --ok-bg: #ECFDF5;
  --ok-ink: #065F46;
  --ok-border: #A7F3D0;
  
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
  --shadow-lg: 0 12px 32px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
  --shadow-hover: 0 16px 36px -6px rgba(79, 70, 229, 0.14), 0 6px 14px -2px rgba(15, 23, 42, 0.04);
  
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 26px;
  --radius-pill: 9999px;
  
  color-scheme: light;
  box-sizing: border-box;
}

/* Dark Theme */
[data-theme="dark"] {
  --bg: #090D16;
  --bg-subtle: #0F1422;
  --surface: #121829;
  --surface-2: #182035;
  --surface-3: #202A44;
  --surface-elevated: #151D31;
  --ink: #F8FAFC;
  --ink-secondary: #CBD5E1;
  --muted: #94A3B8;
  --muted-light: #64748B;
  --line: #222D47;
  --line-subtle: #192238;
  --line-strong: #334155;
  
  --primary: #6366F1;
  --primary-hover: #818CF8;
  --primary-light: rgba(99, 102, 241, 0.15);
  --primary-glow: rgba(99, 102, 241, 0.3);
  --accent-cyan: #22D3EE;
  --accent-purple: #A78BFA;
  --primary-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 55%, #06B6D4 100%);
  --brand-gradient: linear-gradient(135deg, #818CF8 0%, #6366F1 50%, #22D3EE 100%);
  --hero-glow: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.22) 0%, rgba(34, 211, 238, 0.08) 50%, transparent 75%);

  --cat-organize: #60A5FA;
  --cat-organize-bg: rgba(96, 165, 250, 0.14);
  --cat-optimize: #34D399;
  --cat-optimize-bg: rgba(52, 211, 153, 0.14);
  --cat-convert: #FBBF24;
  --cat-convert-bg: rgba(251, 191, 36, 0.14);
  --cat-edit: #A78BFA;
  --cat-edit-bg: rgba(167, 139, 250, 0.14);
  --cat-sign: #FB7185;
  --cat-sign-bg: rgba(251, 113, 133, 0.14);

  --danger-bg: #2C1217;
  --danger-ink: #FDA4AF;
  --danger-border: #4C1D24;
  --ok-bg: #06281D;
  --ok-ink: #6EE7B7;
  --ok-border: #0F4935;
  
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 20px -2px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 12px 36px -4px rgba(0, 0, 0, 0.6);
  --shadow-hover: 0 16px 40px -6px rgba(99, 102, 241, 0.25), 0 4px 16px rgba(0, 0, 0, 0.5);
  
  color-scheme: dark;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #090D16;
    --bg-subtle: #0F1422;
    --surface: #121829;
    --surface-2: #182035;
    --surface-3: #202A44;
    --surface-elevated: #151D31;
    --ink: #F8FAFC;
    --ink-secondary: #CBD5E1;
    --muted: #94A3B8;
    --muted-light: #64748B;
    --line: #222D47;
    --line-subtle: #192238;
    --line-strong: #334155;
    
    --primary: #6366F1;
    --primary-hover: #818CF8;
    --primary-light: rgba(99, 102, 241, 0.15);
    --primary-glow: rgba(99, 102, 241, 0.3);
    --accent-cyan: #22D3EE;
    --accent-purple: #A78BFA;
    --primary-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 55%, #06B6D4 100%);
    --brand-gradient: linear-gradient(135deg, #818CF8 0%, #6366F1 50%, #22D3EE 100%);
    --hero-glow: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.22) 0%, rgba(34, 211, 238, 0.08) 50%, transparent 75%);

    --cat-organize: #60A5FA;
    --cat-organize-bg: rgba(96, 165, 250, 0.14);
    --cat-optimize: #34D399;
    --cat-optimize-bg: rgba(52, 211, 153, 0.14);
    --cat-convert: #FBBF24;
    --cat-convert-bg: rgba(251, 191, 36, 0.14);
    --cat-edit: #A78BFA;
    --cat-edit-bg: rgba(167, 139, 250, 0.14);
    --cat-sign: #FB7185;
    --cat-sign-bg: rgba(251, 113, 133, 0.14);

    --danger-bg: #2C1217;
    --danger-ink: #FDA4AF;
    --danger-border: #4C1D24;
    --ok-bg: #06281D;
    --ok-ink: #6EE7B7;
    --ok-border: #0F4935;
    
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 4px 20px -2px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 12px 36px -4px rgba(0, 0, 0, 0.6);
    --shadow-hover: 0 16px 40px -6px rgba(99, 102, 241, 0.25), 0 4px 16px rgba(0, 0, 0, 0.5);
    
    color-scheme: dark;
  }
}

*,*::before,*::after{box-sizing:border-box}
html{
  scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 76px);
  scroll-behavior: smooth;
}
body{
  margin: 0;
  background-color: var(--bg);
  background-image: var(--hero-glow);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 0.25s ease, color 0.25s ease;
}

img{max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:var(--radius-sm)}

.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* Top Navigation Bar */
header.top{
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  transition: background-color 0.25s ease, border-color 0.25s ease;
}
[data-theme="dark"] header.top{
  background: rgba(18, 24, 41, 0.85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) header.top{
    background: rgba(18, 24, 41, 0.85);
  }
}

header.top .wrap{
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
  gap: 16px;
}

/* Brand Logo */
.logo{
  display: inline-flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 23px;
  letter-spacing: -0.03em;
  transition: transform 0.2s ease;
}
.logo:hover{transform: scale(1.02)}
.logo-mark{
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--primary-gradient);
  display: grid;
  place-items: center;
  box-shadow: 0 4px 12px var(--primary-glow);
  flex-shrink: 0;
  color: #FFFFFF;
}
.logo-mark svg{display:block}
.logo-text{
  display: flex;
  align-items: baseline;
  gap: 5px;
}
.logo-pdf{color: var(--ink); font-weight: 800;}
.logo-world{
  background: var(--brand-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
}
.logo-badge{
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid rgba(99, 102, 241, 0.25);
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  margin-left: 2px;
}

/* Nav Actions */
.nav-group{
  display: flex;
  align-items: center;
  gap: 10px;
}
nav.main{
  display: flex;
  align-items: center;
  gap: 4px;
}
nav.main a{
  font-weight: 600;
  font-size: 14px;
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  color: var(--muted);
  transition: all 0.2s ease;
}
nav.main a:hover{
  color: var(--ink);
  background: var(--surface-3);
}
@media (max-width: 680px){
  nav.main a.hide-sm{display:none}
}

/* Theme Toggle Button */
.theme-btn{
  width: 38px;
  height: 38px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.theme-btn:hover{
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--surface-2);
  transform: translateY(-1px);
}

/* Hero Section */
.hero{
  padding: 68px 0 44px;
  position: relative;
}
.hero .wrap{
  display: grid;
  grid-template-columns: 1.18fr 0.82fr;
  gap: 48px;
  align-items: center;
}

.badge-pill{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 22px;
}
.badge-pill .pulse-dot{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10B981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  animation: pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{transform: scale(1); opacity: 1;}
  50%{transform: scale(1.15); opacity: 0.7;}
}

.hero h1{
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(42px, 6.4vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.038em;
  margin: 0 0 20px;
}
.hero h1 .gradient-text{
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p.lede{
  font-size: clamp(17px, 1.4vw, 20px);
  color: var(--muted);
  max-width: 35em;
  margin: 0 0 32px;
  line-height: 1.6;
}
.hero .cta{
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
}

/* Primary and Ghost Buttons */
.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  border-radius: var(--radius-md);
  padding: 13px 24px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  text-decoration: none;
  line-height: 1.2;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}
.btn-primary{
  background: var(--primary-gradient);
  color: #FFFFFF;
  box-shadow: 0 4px 14px var(--primary-glow);
}
.btn-primary:hover{
  transform: translateY(-2px);
  box-shadow: 0 8px 24px var(--primary-glow);
  filter: brightness(1.06);
}
.btn-primary:active{
  transform: translateY(0);
}
.btn-primary:disabled{
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
  filter: grayscale(0.5);
}
.btn-ghost{
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-sm);
}
.btn-ghost:hover{
  border-color: var(--primary);
  color: var(--primary);
  background: var(--surface-2);
  transform: translateY(-2px);
}
.btn-ghost:active{transform: translateY(0);}
.btn-sm{
  padding: 8px 14px;
  font-size: 13.5px;
  border-radius: var(--radius-sm);
}

/* Hero Feature Highlights */
.hero-highlights{
  display: flex;
  gap: 20px;
  margin-top: 36px;
  flex-wrap: wrap;
}
.highlight-item{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
}
.highlight-item .icon{
  color: var(--primary);
}

/* 3D Floating Hero Showcase */
.sheets-container{
  position: relative;
  height: 380px;
  max-width: 440px;
  width: 100%;
  justify-self: center;
  perspective: 1000px;
}
.sheet{
  position: absolute;
  left: 50%;
  top: 50%;
  width: 220px;
  height: 290px;
  margin: -145px 0 0 -110px;
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  clip-path: polygon(0 0, calc(100% - 36px) 0, 100% 36px, 100% 100%, 0 100%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
}
.sheet::after{
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 36px;
  height: 36px;
  background: var(--surface-3);
  border-bottom-left-radius: 10px;
  border-left: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.sheet .bar{
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--surface-3);
}
.sheet .bar.s{width: 55%}
.sheet .bar.m{width: 80%}
.sheet .tag{
  margin-top: auto;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  letter-spacing: -0.02em;
}
.sheet.a{
  transform: rotate(-13deg) translate(-75px, 15px);
  animation: fanA 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.sheet.b{
  transform: rotate(3deg) translate(0, -6px);
  z-index: 2;
  animation: fanB 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.sheet.c{
  transform: rotate(16deg) translate(75px, 20px);
  animation: fanC 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.sheet:hover{
  box-shadow: var(--shadow-hover);
}
.sheet.a .tag{color: var(--cat-organize)}
.sheet.b .tag{color: var(--cat-sign)}
.sheet.c .tag{color: var(--cat-optimize)}
.sheet.b .stamp{
  position: absolute;
  right: 18px;
  top: 66px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--cat-sign-bg);
  border: 1.5px dashed var(--cat-sign);
  display: grid;
  place-items: center;
  color: var(--cat-sign);
}

@keyframes fanA{from{transform: rotate(0) translate(0,0)}}
@keyframes fanB{from{transform: rotate(0) translate(0,0)}}
@keyframes fanC{from{transform: rotate(0) translate(0,0)}}

@media (prefers-reduced-motion: reduce){
  .sheet{animation:none!important}
}
@media (max-width: 920px){
  .hero{padding: 40px 0 24px}
  .hero .wrap{grid-template-columns: 1fr}
  .sheets-container{height: 310px; transform: scale(0.9)}
}

/* Tools Section */
section.tools{
  padding: 32px 0 84px;
}
.tools-filter-bar{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 26px;
}
.section-title-wrap h2{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(28px, 3.2vw, 38px);
  letter-spacing: -0.025em;
  margin: 0 0 4px;
}
.section-title-wrap p{
  margin: 0;
  color: var(--muted);
  font-size: 15px;
}

.search-box{
  position: relative;
  min-width: 260px;
}
.search-box input{
  width: 100%;
  padding: 10px 14px 10px 38px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.search-box input:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
.search-box .search-ic{
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  display: grid;
  place-items: center;
}

.chips{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.chip{
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius-pill);
  padding: 7px 16px;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  color: var(--muted);
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.chip:hover{
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--surface-2);
}
.chip[aria-pressed="true"]{
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

/* Tool Grid & Cards */
.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
  gap: 18px;
}
.tile{
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 24px;
  text-decoration: none;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.tile:hover{
  transform: translateY(-4px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-hover);
}
.tile .tile-top{
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tile .ic{
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: transform 0.25s ease;
}
.tile:hover .ic{
  transform: scale(1.08);
}
.tile .cat-badge{
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
}
.tile h3{
  margin: 0;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.25;
  color: var(--ink);
}
.tile p{
  margin: 0;
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.5;
  flex: 1;
}
.tile .tile-action{
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
  margin-top: 4px;
  opacity: 0.85;
  transition: all 0.2s ease;
}
.tile:hover .tile-action{
  opacity: 1;
  gap: 9px;
}

/* Category Colors */
.c-organize{ background: var(--cat-organize-bg); color: var(--cat-organize); }
.c-optimize{ background: var(--cat-optimize-bg); color: var(--cat-optimize); }
.c-convert{ background: var(--cat-convert-bg); color: var(--cat-convert); }
.c-edit{ background: var(--cat-edit-bg); color: var(--cat-edit); }
.c-sign{ background: var(--cat-sign-bg); color: var(--cat-sign); }

/* How It Works Section */
section.how{
  padding: 72px 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  transition: background-color 0.25s ease;
}
.steps{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-top: 32px;
}
.step-card{
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 30px 26px;
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.step-card:hover{
  transform: translateY(-3px);
  border-color: var(--line-strong);
}
.step-num{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--primary-gradient);
  color: #FFFFFF;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 12px var(--primary-glow);
}
.step-card h3{
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 700;
  margin: 0 0 8px;
  letter-spacing: -0.015em;
}
.step-card p{
  margin: 0;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.55;
}
@media (max-width: 800px){
  .steps{grid-template-columns: 1fr}
}

/* Security & Privacy Banner */
section.privacy{
  padding: 80px 0;
}
.privacy-banner{
  background: linear-gradient(135deg, #111827 0%, #1E1B4B 60%, #0F172A 100%);
  color: #FFFFFF;
  border-radius: var(--radius-xl);
  padding: 48px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 36px;
  align-items: center;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(255, 255, 255, 0.1);
  position: relative;
  overflow: hidden;
}
.privacy-banner::after{
  content: "";
  position: absolute;
  top: -50%;
  right: -20%;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
  pointer-events: none;
}
.privacy-icon-box{
  width: 90px;
  height: 90px;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #38BDF8;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.privacy-content h2{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(26px, 3.2vw, 36px);
  letter-spacing: -0.025em;
  margin: 0 0 10px;
}
.privacy-content p{
  margin: 0 0 18px;
  color: #CBD5E1;
  font-size: 16px;
  max-width: 42em;
  line-height: 1.6;
}
.privacy-features{
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}
.privacy-badge{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: var(--radius-pill);
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #F8FAFC;
}
@media (max-width: 680px){
  .privacy-banner{grid-template-columns: 1fr; padding: 32px 24px}
}

/* Footer */
footer{
  padding: 36px 0 48px;
  color: var(--muted);
  font-size: 14.5px;
  border-top: 1px solid var(--line);
}
footer .wrap{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.footer-brand{
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--ink);
}

/* Tool Workspace Styles */
.ws{padding: 36px 0 80px}
.back{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--muted);
  font-weight: 600;
  font-size: 14.5px;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
  transition: all 0.2s ease;
}
.back:hover{
  color: var(--ink);
  border-color: var(--line-strong);
  transform: translateX(-2px);
}
.ws-head{
  display: flex;
  gap: 20px;
  align-items: center;
  margin-bottom: 30px;
}
.ws-head .ic{
  width: 64px;
  height: 64px;
  border-radius: 18px;
  box-shadow: var(--shadow-sm);
}
.ws-head h1{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(30px, 4.2vw, 46px);
  letter-spacing: -0.03em;
  margin: 0;
  line-height: 1.1;
}
.ws-head p{
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 16px;
  max-width: 44em;
}

/* Drop Zone */
.drop{
  border: 2px dashed var(--line-strong);
  border-radius: var(--radius-xl);
  background: var(--surface);
  padding: 64px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  transition: all 0.25s ease;
  position: relative;
}
.drop.over{
  border-color: var(--primary);
  background: var(--primary-light);
  transform: scale(1.005);
}
.drop-icon-wrap{
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: var(--primary-light);
  color: var(--primary);
  display: grid;
  place-items: center;
  margin-bottom: 4px;
}
.drop .big{
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  color: var(--ink);
}
.drop small{
  color: var(--muted);
  font-size: 14px;
}

/* Workspace Layout */
.ws-body{
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 26px;
  align-items: start;
}
@media (max-width: 920px){
  .ws-body{grid-template-columns: 1fr}
}
.panel{
  background: var(--surface);
  border-radius: var(--radius-xl);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  padding: 26px;
}
.panel h2{
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 700;
  margin: 0 0 16px;
  letter-spacing: -0.015em;
  overflow-wrap: anywhere;
}
.side{
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 88px);
}
@media (max-width: 920px){
  .side{position: static}
}

/* File items list */
.files{
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.file{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: var(--surface-2);
  border: 1px solid var(--line-subtle);
  transition: all 0.2s ease;
}
.file:hover{
  border-color: var(--line-strong);
}
.file .fi{
  width: 44px;
  height: 52px;
  border-radius: 9px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--cat-sign);
  flex-shrink: 0;
  overflow: hidden;
}
.file .fi img{width:100%;height:100%;object-fit:cover}
.file .meta{
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.file .name{
  font-weight: 600;
  font-size: 14.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file .sub{
  font-size: 12.5px;
  color: var(--muted);
}
.icon-btn{
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  padding: 0;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
}
.icon-btn:hover:not(:disabled){
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--surface-3);
  transform: translateY(-1px);
}
.icon-btn:disabled{
  opacity: 0.35;
  cursor: not-allowed;
}
.files-actions{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

/* Fields & Options */
.field{
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 18px;
}
.field[hidden]{display:none}
.field label{
  font-weight: 600;
  font-size: 14px;
}
.hint{
  font-size: 12.5px;
  color: var(--muted);
}
.field input[type=text],.field input[type=number],.field select{
  width: 100%;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 14.5px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.field input[type=text]:focus,.field input[type=number]:focus,.field select:focus{
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
  background: var(--surface);
}
.field input[type=range]{
  width: 100%;
  accent-color: var(--primary);
  cursor: pointer;
}
.row-val{
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.val-pill{
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-light);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}

/* Alerts and Messages */
.msg{
  border-radius: var(--radius-md);
  padding: 13px 16px;
  font-size: 14px;
  margin: 0 0 16px;
  line-height: 1.5;
}
.msg.err{
  background: var(--danger-bg);
  color: var(--danger-ink);
  border: 1px solid var(--danger-border);
}
.msg.info{
  background: var(--surface-2);
  color: var(--ink-secondary);
  border: 1px solid var(--line);
}
.full{width:100%}

/* Result Card */
.result{
  text-align: center;
  padding: 56px 28px;
}
.result .check{
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--ok-bg);
  border: 2px solid var(--ok-border);
  color: var(--ok-ink);
  display: grid;
  place-items: center;
  margin: 0 auto 20px;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.18);
  animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes bounceIn{
  from{transform: scale(0.6); opacity: 0;}
  to{transform: scale(1); opacity: 1;}
}
.result h2{
  font-family: var(--font-display);
  font-size: clamp(28px, 3.8vw, 40px);
  margin: 0 0 8px;
  letter-spacing: -0.025em;
}
.result p{
  color: var(--muted);
  font-size: 16px;
  margin: 0 0 28px;
  overflow-wrap: anywhere;
}
.result .actions{
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}

/* Thumbnails Visualizer */
.thumbs{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
}
.thumb{
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.thumb:hover{
  border-color: var(--line-strong);
  box-shadow: var(--shadow-md);
}
.thumb .pg{
  width: 100%;
  aspect-ratio: 3/4;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 6px;
  background: #FFFFFF;
}
.thumb img{
  max-width: 100%;
  max-height: 100%;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  background: #FFFFFF;
  transition: transform 0.2s ease;
}
.thumb .n{
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.thumb .ctl{
  display: flex;
  gap: 4px;
}
.thumb .ctl .icon-btn{
  width: 28px;
  height: 28px;
  border-radius: 7px;
}

/* Signature Pad Canvas */
.sigpad-wrap{
  position: relative;
  background: #FFFFFF;
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.sigpad{
  width: 100%;
  height: 180px;
  background: #FFFFFF;
  touch-action: none;
  cursor: crosshair;
  display: block;
}
.sigpad-line{
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 35px;
  border-bottom: 1px dashed rgba(0, 0, 0, 0.15);
  pointer-events: none;
}
.sigpad-x{
  position: absolute;
  left: 20px;
  bottom: 38px;
  font-size: 14px;
  font-weight: 700;
  color: rgba(0, 0, 0, 0.25);
  pointer-events: none;
}

/* Toast Message */
.toast{
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translateX(-50%) translateY(24px);
  opacity: 0;
  background: var(--ink);
  color: var(--bg);
  padding: 12px 22px;
  border-radius: var(--radius-pill);
  font-weight: 600;
  font-size: 14px;
  box-shadow: var(--shadow-lg);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  z-index: 1000;
  max-width: 90vw;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.show{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.spin{
  width: 18px;
  height: 18px;
  border: 2.5px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: sp 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes sp{to{transform:rotate(360deg)}}

function loadLib(buf){ return PDFDocument.load(buf, { ignoreEncryption:true }); }
function pdfjsDoc(buf){ return pdfjsLib.getDocument({ data:new Uint8Array(buf.slice(0)) }).promise; }
const pdfBlob = bytes => new Blob([bytes], { type:'application/pdf' });

function parseGroups(str, total){
  const groups = [];
  for (const part of String(str).split(',').map(s=>s.trim()).filter(Boolean)){
    const m = part.match(/^(\d+)\s*(?:-\s*(\d+|end))?$/i);
    if (!m) throw new Error(`"${part}" isn't a page or range. Use a format like 1-3, 5, 8-end.`);
    const a = +m[1]; const b = m[2] ? (m[2].toLowerCase()==='end' ? total : +m[2]) : a;
    if (a < 1 || b > total || a > b) throw new Error(`${part} is outside this document, which has ${total} page${total>1?'s':''}.`);
    const g = []; for (let i=a; i<=b; i++) g.push(i-1); groups.push(g);
  }
  if (!groups.length) throw new Error('Enter at least one page number.');
  return groups;
}
function canvasToBlob(c, type, q){ return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Could not render this page.')), type, q)); }
async function renderPage(pdf, i, scale){
  const page = await pdf.getPage(i);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({ canvasContext:ctx, viewport:vp }).promise;
  return { canvas:c, base:page.getViewport({ scale:1 }) };
}
function loadImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => res({ im, url }); im.onerror = () => rej(new Error(`${file.name} couldn't be read as an image.`)); im.src = url; });
}
async function zipBlobs(items, name){
  const zip = new JSZip(); items.forEach(it => zip.file(it.name, it.data));
  return { blob: await zip.generateAsync({ type:'blob' }), filename: name };
}

/* downloads: uses the page's download capability when hosted, plain link otherwise */
async function getDownloads(){
  try { if (window.claude && typeof window.claude.use === 'function') return await window.claude.use('downloads'); } catch(e){}
  return null;
}
async function saveBlob(blob, filename){
  const d = await getDownloads();
  if (d){
    try { await d.save({ filename, data: blob }); toast('Downloaded ' + filename); }
    catch(e){
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') { toast('A download prompt is already open.'); return; }
      fallbackSave(blob, filename);
    }
    return;
  }
  fallbackSave(blob, filename);
}
function fallbackSave(blob, filename){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

      const pages = d.getPages(); const targets = o.page === 'all' ? pages : [o.page === 'first' ? pages[0] : pages[pages.length-1]];
      const w = +o.width, h = w * png.h / png.w, mg = 40;
      targets.forEach(p => { const { width:W } = p.getSize(); const x = o.pos==='br' ? W-mg-w : o.pos==='bc' ? (W-w)/2 : mg; p.drawImage(img, { x, y:mg, width:w, height:h }); });
      return { blob: pdfBlob(await d.save()), filename:`${baseName(f.name)}-signed.pdf` };
    } }
];

function route(){

}
function resetTool(t){

  state.opts = {}; (t.fields||[]).forEach(f => { if (f.key && f.type !== 'note') state.opts[f.key] = f.def; });
  sig.strokes = 0; sig.paths = [];
}

function fieldHTML(f){

    <div class="row-val"><label for="${id}">${f.label}</label><span class="val-pill" id="${id}-v">${esc(v)} ${f.unit||''}</span></div>
    <input type="range" id="${id}" data-key="${f.key}" min="${f.min}" max="${f.max}" value="${esc(v)}">
  </div>`;
  const input = f.type === 'select'
    ? `<select id="${id}" data-key="${f.key}">${f.choices.map(([k,l]) => `<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('')}</select>`
    : `<input type="${f.type}" id="${id}" data-key="${f.key}" value="${esc(v)}" ${f.type==='number'?'min="0" inputmode="numeric"':''}>`;
  return `<div class="field" ${show?'':'hidden'}><label for="${id}">${f.label}</label>${input}${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div>`;
}

function bindTool(){
  const app = $('#app'); const picker = $('#picker');
  app.querySelectorAll('[data-act="pick"]').forEach(b => b.addEventListener('click', () => picker.click()));
  picker.addEventListener('change', () => { addFiles([...picker.files]); picker.value = ''; });
  const ws = app.querySelector('.ws');
  ['dragenter','dragover'].forEach(ev => ws.addEventListener(ev, e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => ws.addEventListener(ev, e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); }));
  ws.addEventListener('drop', e => { if (!state.result && !state.busy && e.dataTransfer && e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });

  app.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { state.files.splice(+b.dataset.del,1); state.error=''; renderTool(); }));
  app.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => { const i=+b.dataset.up; [state.files[i-1],state.files[i]]=[state.files[i],state.files[i-1]]; renderTool(); }));
  app.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => { const i=+b.dataset.down; [state.files[i+1],state.files[i]]=[state.files[i],state.files[i+1]]; renderTool(); }));
  app.querySelectorAll('[data-ol]').forEach(b => b.addEventListener('click', () => { const k=+b.dataset.ol; [state.org[k-1],state.org[k]]=[state.org[k],state.org[k-1]]; renderTool(); }));
  app.querySelectorAll('[data-orr]').forEach(b => b.addEventListener('click', () => { const k=+b.dataset.orr; [state.org[k+1],state.org[k]]=[state.org[k],state.org[k+1]]; renderTool(); }));
  app.querySelectorAll('[data-or]').forEach(b => b.addEventListener('click', () => { const p=state.org[+b.dataset.or]; p.rot=(p.rot+90)%360; renderTool(); }));
  app.querySelectorAll('[data-od]').forEach(b => b.addEventListener('click', () => { state.org.splice(+b.dataset.od,1); renderTool(); }));
  const clr = app.querySelector('[data-act="clear"]'); if (clr) clr.addEventListener('click', () => { state.files=[]; state.org=[]; state.error=''; renderTool(); });

  app.querySelectorAll('[data-key]').forEach(inp => {
    const upd = () => {
      state.opts[inp.dataset.key] = inp.value;
      const v = document.getElementById(inp.id + '-v');
      if (v){
        const f = state.tool.fields.find(x=>x.key===inp.dataset.key);
        v.textContent = inp.value + ' ' + (f.unit||'');
      }
    };
    inp.addEventListener('input', upd);
    inp.addEventListener('change', () => {
      upd();
      if (inp.tagName === 'SELECT' && state.tool.fields.some(f => f.showIf && f.showIf[0] === inp.dataset.key)) renderTool();
    });
  });

  const run = $('#run'); if (run) run.addEventListener('click', runTool);
  const dl = app.querySelector('[data-act="dl"]'); if (dl) dl.addEventListener('click', () => saveBlob(state.result.blob, state.result.filename));
  const again = app.querySelector('[data-act="again"]'); if (again) again.addEventListener('click', () => { resetTool(state.tool); renderTool(); });
  if ($('#sigpad')) setupSig($('#sigpad'));
  const sc = app.querySelector('[data-act="sigclear"]'); if (sc) sc.addEventListener('click', () => { sig.strokes = 0; sig.paths = []; setupSig($('#sigpad')); });
}

async function addFiles(list){
  const t = state.tool; state.error = '';
  const ok = list.filter(f => t.accept === 'pdf' ? (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) : f.type.startsWith('image/'));
  if (!ok.length){ state.error = t.accept === 'pdf' ? 'Only PDF documents are supported for this tool.' : 'Only image files (JPG, PNG, WebP) are supported for this tool.'; renderTool(); return; }
  if (ok.length < list.length) toast(`${list.length - ok.length} file(s) skipped due to unsupported file format.`);
  const items = ok.map(f => ({ id:++uid, file:f, name:f.name, size:f.size }));
  state.files = t.multiple ? state.files.concat(items) : [items[0]];
  state.result = null; if (t.custom === 'organize') state.org = [];
  items.forEach(it => { if (t.accept === 'image') it.thumb = URL.createObjectURL(it.file); });
  renderTool();
  if (t.accept === 'pdf') for (const it of items){ try { it.pages = (await loadLib(await it.file.arrayBuffer())).getPageCount(); } catch(e){ it.pages = 0; } }
  if (t.custom === 'organize' && state.files[0]) await buildThumbs(state.files[0]);
  if (state.tool === t && !state.busy && !state.result) renderTool();
}

async function buildThumbs(f){
  try {
    const pdf = await pdfjsDoc(await f.file.arrayBuffer()); const arr = [];
    for (let i=1; i<=pdf.numPages; i++){ const { canvas } = await renderPage(pdf, i, .35); arr.push({ idx:i-1, rot:0, src: canvas.toDataURL('image/jpeg', .8) }); }
    if (state.files[0] === f) state.org = arr;
  } catch(e){ state.error = 'This PDF could not be previewed. It may be encrypted or corrupted.'; }
}

async function runTool(){
  const t = state.tool; state.busy = true; state.error = ''; renderTool();
  const prog = m => { const el = $('#prog'); if (el) el.textContent = m; };
  await new Promise(r => setTimeout(r, 40));
  try { state.result = await t.run(state.files, { ...state.opts }, prog); }
  catch(e){
    console.error(e);
    const m = String(e && e.message || e);
    state.error = /encrypt|password/i.test(m) ? 'This PDF is password-protected. Please remove the password and try again.'
      : (/Failed to parse|Invalid PDF|No PDF header/i.test(m) ? 'This file is damaged or not a valid PDF.' : m);
  }
  state.busy = false; renderTool();
}

function setupSig(c){
  sig.canvas = c; const dpr = window.devicePixelRatio || 1; const r = c.getBoundingClientRect();
  c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1E1B4B';
  sig.paths.forEach(path => { ctx.beginPath(); path.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); if (path.length === 1) ctx.lineTo(path[0][0]+.1, path[0][1]+.1); ctx.stroke(); });
  let cur = null;
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { c.setPointerCapture(e.pointerId); cur = [pt(e)]; sig.paths.push(cur); ctx.beginPath(); ctx.moveTo(cur[0][0], cur[0][1]); ctx.lineTo(cur[0][0]+.1, cur[0][1]+.1); ctx.stroke(); sig.strokes++; };
  c.onpointermove = e => { if (!cur) return; const p = pt(e); const q = cur[cur.length-1]; cur.push(p); ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); };
  c.onpointerup = c.onpointercancel = () => { cur = null; };
}
function trimmedSignature(){
  const c = sig.canvas; if (!c || !sig.strokes) return null;
  const ctx = c.getContext('2d'); const W = c.width, H = c.height; const d = ctx.getImageData(0,0,W,H).data;
  let x0=W, y0=H, x1=-1, y1=-1;
  for (let y=0; y<H; y++) for (let x=0; x<W; x++) if (d[(y*W+x)*4+3] > 10){ if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y; }
  if (x1 < 0) return null;
  const pad = 6; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(W-1,x1+pad); y1=Math.min(H-1,y1+pad);
  const o = document.createElement('canvas'); o.width = x1-x0+1; o.height = y1-y0+1; o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  const bin = atob(o.toDataURL('image/png').split(',')[1]); const bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return { bytes, w:o.width, h:o.height };
}
